name = "tender-monitor-bot"
main = "src/index.mjs"
compatibility_date = "2026-05-01"

# Логи Worker'а. Були вимкнені до 23.08.2026, і через це весь `console.error`
# у цьому коді летів у нікуди: `setMyCommands` стабільно падав, помилка
# ловилась у catch, і дізнатись про це можна було лише заміром getMyCommands
# іззовні. Увімкнути в панелі недостатньо — `wrangler deploy` застосовує
# конфіг ізвідси, тож без цієї секції наступний деплой знову зробив би нас
# сліпими. Успадковується обома [env.*]. Гейт — worker/test/wrangler.test.mjs.
[observability]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "EPHEMERAL_KV"
id = "f9c6d80922f24615ab394d3cc1aa7251"   # KV namespace "tender-monitor-ephemeral"

[env.staging]
name = "tender-monitor-bot-staging"
vars = { STATE_BACKEND = "gitlab", GITLAB_PROJECT_ID = "14", GITLAB_REF = "staging-state", GITLAB_CODE_REF = "main" }

[[env.staging.kv_namespaces]]
binding = "EPHEMERAL_KV"
id = "197ecb4e174848aa8efed56ffffa8698"   # staging KV namespace

[env.production]
name = "tender-monitor-bot"
# GITLAB_* лежать тут ЗАРАНЕЕ, хоч бекенд поки github: щоб cutover був зміною
# одного значення (`github` → `gitlab`), а не двома правками, з яких другу
# легко забути. Забути її означало б завести бота в бекенд, який не знає, куди
# писати — `gitlab.mjs` читає GITLAB_PROJECT_ID, GITLAB_REF і GITLAB_TOKEN
# (перші два звідси, токен — секретом Worker'а). Поки STATE_BACKEND=github ці
# два значення просто не читаються. Гейт — worker/test/wrangler.test.mjs.
vars = { STATE_BACKEND = "github", GITLAB_PROJECT_ID = "14", GITLAB_REF = "prod-state", GITLAB_CODE_REF = "main" }

[[env.production.kv_namespaces]]
binding = "EPHEMERAL_KV"
id = "f9c6d80922f24615ab394d3cc1aa7251"   # KV namespace "tender-monitor-ephemeral"

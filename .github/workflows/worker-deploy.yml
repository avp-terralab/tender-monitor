name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'commands.mjs'
      - 'telegram.mjs'
      - 'prozorro.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: node --test test/*.test.mjs worker/test/*.test.mjs
      - name: Install wrangler
        run: cd worker && npm install --no-save wrangler@^3
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `--env production` тут ОБОВ'ЯЗКОВИЙ. Топ-рівень wrangler.toml має те
        # саме ім'я скрипта (`tender-monitor-bot`), тож `wrangler deploy` без
        # прапорця викочує той самий Worker, але з топ-рівневим конфігом — і
        # блок [env.production] не застосовується взагалі. Виглядає це так, ніби
        # налаштування є, а насправді вони мертві: на cutover прапорець
        # STATE_BACKEND перемкнули б там, куди ніхто не дивиться.
        # Гейт — worker/test/wrangler.test.mjs.
        run: npx wrangler deploy --env production

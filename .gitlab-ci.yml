stages:
  - test
  - deploy

test:
  stage: test
  script:
    - echo "PATH=$PATH"
    - whoami
    - which node || echo "no node in PATH"
    - which nvm || echo "no nvm in PATH"
    - ls -la /usr/local/bin 2>/dev/null | grep -i node || true
    - ls -la /usr/bin 2>/dev/null | grep -i node || true
    - ls -la ~/.nvm/versions/node 2>/dev/null || true
    - ls -la /opt 2>/dev/null || true
    - find / -maxdepth 6 -iname "node" -type f 2>/dev/null || true
    - node --test test/*.test.mjs worker/test/*.test.mjs

deploy-staging:
  stage: deploy
  when: manual
  script:
    - cd worker && npm install --no-save wrangler@^3 && npx wrangler deploy --env staging

monitor-staging:
  stage: test
  script:
    - node ci.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TARGET == "staging"'

deploy-production:
  stage: deploy
  script:
    - cd worker && npm install --no-save wrangler@^3 && npx wrangler deploy --env production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

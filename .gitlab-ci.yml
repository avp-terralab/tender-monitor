stages:
  - test
  - deploy

default:
  before_script:
    - export PATH="$HOME/.local/node-v22.23.2-linux-x64/bin:$PATH"

test:
  stage: test
  # Не бігати на `staging-state`. Ця гілка — сховище стану: `monitor-staging`
  # комітить туди щоразу, коли знайшов зміни, і кожен такий коміт інакше тягнув
  # би повний суїт. При розкладі кожні 15 хв це до ~96 прогонів на добу на
  # спільному раннері з `concurrent = 1` — черга росла б і затримувала наступний
  # тік монітора. Код на `staging-state` усе одно приїжджає мерджем із `main`,
  # де тести вже пройшли.
  #
  # Далі — стандартний набір проти ДУБЛЮВАННЯ пайплайнів. Голе `when: always`
  # давало попередження лінта «may allow multiple pipelines to run for a single
  # action»: на гілці з відкритим MR один пуш створював би і branch-пайплайн, і
  # MR-пайплайн, тобто суїт біг би двічі — на раннері з `concurrent = 1` це
  # прямий простій. Порядок правил має значення, читається згори вниз.
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging-state"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'          # MR — біжимо
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never                                                 # гілка з відкритим MR — вже покрито вище
    - if: '$CI_COMMIT_BRANCH'                                     # звичайний пуш у гілку
  script:
    - node --test test/*.test.mjs worker/test/*.test.mjs

deploy-staging:
  stage: deploy
  when: manual
  # Тут це і так типове значення (`when: manual` на верхньому рівні), але
  # задано явно — щоб обидві деплойні джоби читались однаково й ніхто не
  # мусив пам'ятати, що типове залежить від місця оголошення. Див. коментар
  # у deploy-production.
  allow_failure: true
  script:
    - cd worker && npm install --no-save wrangler@^3 && npx wrangler deploy --env staging

# Спільний блок «закомітити стан і запушити у свою гілку» для обох моніторів.
# Винесений у шаблон НЕ заради краси: до 23.08 існував лише staging-монітор, і
# коли готували cutover, спокуса була скопіювати ці 78 рядків для прода. Саме
# так у цьому проєкті вже тричі розходились дубльовані шляхи (найсвіжіший
# приклад — кнопка «повторити», яка забула три речі з головного шляху). Тому
# шлях один, а гілку задає змінна STATE_BRANCH.
.monitor-commit-push:
  script:
    - |
      set -e
      # ci.mjs пише _state/ + watchlist.json у робочу копію того ref, який
      # викачав пайплайн — це гілка з STATE_BRANCH, вона ж ціль розкладу в
      # GitLab, вона ж GITLAB_REF у worker/wrangler.toml для відповідного
      # оточення. На відміну від monitor.yml, тут треба комітити й пушити
      # явно. GitLab CI викачує detached HEAD незалежно від типу ref, тож
      # звичайні `git push` / `git pull --rebase` (які спираються на tracking
      # branch) не працюють — кожен пуш і ребейс нижче називає гілку прямо.
      : "${STATE_BRANCH:?STATE_BRANCH not set}"

      git config user.name "gitlab-ci"
      git config user.email "ci@cl-gl.listerralab.com"

      # Токен НЕ осідає на машині збірки. `git remote set-url` із креденшелами
      # в URL записав би його в .git/config білд-каталогу shell-раннера, а той
      # переживає джобу — це рівно те, що правило флоту забороняє («на машину
      # збірки секрет не кладуть файлом»). `git -c` діє на один виклик і
      # нікуди не пишеться; заразом URL лишається без креденшелів, тож git не
      # покаже токен у тексті помилки.
      PUSH_URL="https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      PUSH_AUTH="Authorization: Basic $(printf 'oauth2:%s' "${GITLAB_TOKEN}" | base64 -w0)"

      git add _state/ watchlist.json
      if git diff --staged --quiet; then
        echo "No state changes to commit."
        exit 0
      fi

      # Same debounce as monitor.yml: _watched_feed_cursor.json drifts every run
      # even when nothing changed, so a cursor-only diff is committed at most
      # once every ~6h; any other state file forces an immediate commit.
      SIGNIFICANT=$(git diff --staged --name-only \
        | grep -v -E '^_state/_watched_feed_cursor\.json$' || true)

      if [ -z "$SIGNIFICANT" ]; then
        LAST_CURSOR_TS=$(git log -1 --format=%ct --grep='^monitor: cursor sync' 2>/dev/null || echo 0)
        LAST_CURSOR_TS=${LAST_CURSOR_TS:-0}
        NOW=$(date +%s)
        AGE=$((NOW - LAST_CURSOR_TS))
        if [ "$AGE" -lt 21600 ]; then
          echo "Cursor-only diff; last sync ${AGE}s ago (<6h). Skipping commit."
          git reset
          exit 0
        fi
        MSG="monitor: cursor sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      else
        MSG="monitor: state update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      fi

      git commit -m "$MSG"
      # Retry with rebase if the state branch moved during the run (concurrent
      # push from another schedule tick or manual commit). State files are
      # append-only / merge-friendly, so rebase is usually clean — but two
      # runs computing near-identical state (e.g. cursor timestamps) moments
      # apart can produce a genuine line-level conflict git can't auto-merge.
      # In that case the concurrent run's own commit already captured
      # equivalent state, so it's safe to drop this run's commit rather than
      # hard-fail.
      #
      # Гілка перевірена живим прогоном 21.08.2026 на staging-state: зсув ref
      # під джобою дав `Push attempt 1 failed` → rebase → `Pushed on attempt 2`,
      # стан не втрачено. Випадок «Rebase conflict» досі не траплявся — саме
      # його треба виглядати в логах перших днів після cutover, бо джоба там
      # виходить ЗЕЛЕНОЮ, відкинувши власний коміт.
      for attempt in 1 2 3; do
        if git -c http.extraHeader="${PUSH_AUTH}" push "$PUSH_URL" "HEAD:${STATE_BRANCH}"; then
          echo "Pushed on attempt $attempt"
          exit 0
        fi
        echo "Push attempt $attempt failed; fetching + rebasing onto ${STATE_BRANCH} and retrying..."
        # FETCH_HEAD, а не origin/$STATE_BRANCH: remote-tracking ref з'являється
        # лише якщо в remote.origin.fetch налаштований відповідний refspec, а ми
        # ремоут навмисно не переписуємо. FETCH_HEAD пише сам `git fetch`.
        git fetch origin "$STATE_BRANCH"
        if ! git rebase FETCH_HEAD; then
          echo "Rebase conflict (concurrent state update) — aborting rebase and skipping this commit."
          git rebase --abort
          exit 0
        fi
      done
      echo "Push failed after 3 attempts"
      exit 1

.monitor-vars: &monitor-vars
  # Дефолтне мілке клонування (GIT_DEPTH=20) ламає два місця: `git rebase` у
  # прищепленому репозиторії може не знайти спільного предка, а дебаунс
  # курсора шукає `git log --grep` на 6 годин назад і впирався б у стелю з
  # 20 комітів. Shell-раннер перевикористовує робочу теку, тож повна глибина
  # коштує один раз.
  GIT_DEPTH: 0

monitor-staging:
  stage: test
  # Відповідник `concurrency: {group: tender-monitor}` із monitor.yml: два тіки
  # не мають накладатись. Цикл ходить у Prozorro й комітить стан, тож паралельні
  # запуски або конфліктували б на пуші, або дублювали сповіщення. Ребейс-ретрай
  # це пом'якшує, але не запобігає — а гілка з конфліктом виходить зеленою,
  # відкинувши свій коміт, тобто наклад був би тихим.
  resource_group: monitor-staging
  variables:
    <<: *monitor-vars
    STATE_BRANCH: staging-state
  script:
    # Тестовий бот (@TL2026testBot) і приватний чат оператора — щоб перевірка
    # ніколи не написала реальним користувачам.
    - export TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN_STAGING"
    - export TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID_STAGING"
    - node ci.mjs
    - !reference [.monitor-commit-push, script]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TARGET == "staging"'

# Прод-монітор. Заведений 23.08.2026 ЗАРАНЕЕ, до cutover: Крок 3 плану каже
# «увімкнути Scheduled Pipeline», а вмикати було нічого — джоби не існувало.
# Та сама пастка вже спрацювала зі staging: розклад стояв активним і мовчав,
# бо на гілці не було .gitlab-ci.yml (`last_pipeline: None` за весь час).
#
# ⚠️ Запускається ЛИШЕ розкладом із SCHEDULE_TARGET=production, і сам розклад
# створюється НЕАКТИВНИМ — інакше він писав би реальним користувачам паралельно
# з погодинним monitor.yml на GitHub, тобто дублював сповіщення. Увімкнути —
# рівно на Кроці 3 cutover, одночасно з вимкненням GitHub-розкладу.
#
# ⚠️ Пише стан у `main`, а вона ЗАХИЩЕНА (push лише Maintainer). Токен проєкту
# має Developer, тож до виконання Кроку 0.1 плану ця джоба впаде на пуші. Це
# очікувано й задокументовано — див. Task 10, Крок 0.1.
monitor-production:
  stage: test
  resource_group: monitor-production
  variables:
    <<: *monitor-vars
    STATE_BRANCH: main
  script:
    # Тут креденшели РЕАЛЬНОГО бота: ci.mjs читає рівно TELEGRAM_BOT_TOKEN і
    # TELEGRAM_CHAT_ID, тож перейменовувати нічого не треба — обидві змінні
    # заводяться в CI/CD проєкту під цими іменами (masked, unprotected).
    - node ci.mjs
    - !reference [.monitor-commit-push, script]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TARGET == "production"'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TARGET == "staging"'

deploy-production:
  stage: deploy
  script:
    - cd worker && npm install --no-save wrangler@^3 && npx wrangler deploy --env production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      # `allow_failure` задано ЯВНО, бо типове значення тут залежить від того,
      # де стоїть `when: manual`. На верхньому рівні джоби (як у deploy-staging)
      # воно типово `true` — джоба необов'язкова. Всередині `rules:` воно типово
      # `false` — джоба стає БЛОКУЮЧОЮ, і пайплайн назавжди висить у статусі
      # `manual`/«Blocked», чекаючи на кнопку, якої ніхто не натисне.
      # Через це всі пайплайни на `main` ніколи не ставали зеленими, хоч `test`
      # і проходив — тобто індикатор перестав відрізняти «тести пройшли» від
      # «тести впали». Прод і далі деплоїться лише кнопкою; змінюється рівно
      # те, чи чекає на неї статус пайплайна.
      allow_failure: true
